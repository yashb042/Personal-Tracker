name: Tracker Scheduled Reminders

on:
  schedule:
    # Daily tracking prompt at 8:00 AM IST
    - cron: '30 2 * * *'
    # Sunday weekly report at 10:30 PM IST
    - cron: '0 17 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        type: choice
        options:
          - daily-prompt
          - sunday
        default: daily-prompt

permissions:
  contents: write

concurrency:
  group: tracker-telegram-data
  cancel-in-progress: false

jobs:
  run-scheduled-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Reruns need the latest claim rather than their original commit.
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claim today's prompt
        id: prompt
        if: github.event.schedule == '30 2 * * *' || github.event.inputs.job == 'daily-prompt'
        shell: bash
        run: |
          claim_output="$(mktemp)"
          trap 'rm -f "$claim_output"' EXIT
          for attempt in 1 2 3; do
            git fetch --no-tags origin master
            git switch --detach FETCH_HEAD
            : > "$claim_output"
            GITHUB_OUTPUT="$claim_output" node scripts/telegram-tracker.mjs claim-daily-prompt
            if [[ ! -s "$claim_output" ]]; then
              exit 0
            fi
            git add data/bot-state.json
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: claim daily tracker prompt'
            if git push origin HEAD:master; then
              cat "$claim_output" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Could not persist the prompt claim on attempt $attempt of 3."
          done
          exit 1

      - name: Send today's prompt
        if: steps.prompt.outputs.date != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROMPT_DATE: ${{ steps.prompt.outputs.date }}
        run: node scripts/telegram-tracker.mjs send-daily-prompt

      - name: Send weekly report
        if: github.event.schedule == '0 17 * * 0' || github.event.inputs.job == 'sunday'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-tracker.mjs sunday
